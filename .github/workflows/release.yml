name: Build & Publish Release

# Runs only when a version tag is pushed (e.g. v1.2.0) or when started by hand
# from the Actions tab. Ordinary pushes to branches do not trigger it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark this release as pre-release / beta'
        type: boolean
        default: false
      draft:
        description: 'Create as a draft release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version_step.outputs.version_name }}
      tag_name: ${{ steps.version_step.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Version
        id: version_step
        run: |
          PLIST_VERSION=$(python3 -c "import plistlib; print(plistlib.load(open('Resources/Info.plist','rb'))['CFBundleShortVersionString'])")

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            if [ "$VERSION" != "$PLIST_VERSION" ]; then
              echo "::warning title=Version mismatch::Tag $TAG does not match Info.plist ($PLIST_VERSION). The app will be built as $VERSION."
            fi
          else
            VERSION="$PLIST_VERSION"
            TAG="v$VERSION"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid version (expected e.g. 1.2.0 or 1.2.0-beta.1)."
            exit 1
          fi

          echo "Release version: $VERSION"
          echo "Release tag: $TAG"
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

  build-release:
    needs: check-version
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version_name }}
      TAG: ${{ needs.check-version.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build universal NetMeter.app (Apple Silicon + Intel)
        env:
          UNIVERSAL: '1'
          APP_VERSION: ${{ env.VERSION }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build_app.sh

      - name: Package DMG, ZIP & checksums
        run: ./scripts/package_release.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetMeter-${{ env.TAG }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: "NetMeter ${{ env.TAG }}"
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ## Install

            1. Download **NetMeter-${{ env.TAG }}-macOS.dmg**, open it and drag **NetMeter** into **Applications**.
            2. Open NetMeter from Applications. It appears in the menu bar, not the Dock.

            > [!NOTE]
            > NetMeter is not notarized by Apple, so macOS blocks it the first time.
            > Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**.
            > Or run this once in Terminal:
            > ```bash
            > xattr -dr com.apple.quarantine /Applications/NetMeter.app
            > ```

            Requires macOS 13 Ventura or later. Runs natively on Apple Silicon and Intel Macs.

            Verify downloads with `shasum -a 256 -c checksums-sha256.txt`.
          files: |
            dist/*.dmg
            dist/*.zip
            dist/checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
